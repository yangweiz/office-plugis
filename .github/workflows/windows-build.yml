name: Windows build and verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static checks
        run: python3 scripts/verify-static.py

  core:
    name: Core build and tests
    runs-on: windows-2022
    needs: static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build managed projects
        shell: powershell
        run: |
          $projects = @(
            "src\Suite.Core\Suite.Core.csproj",
            "src\Suite.Infrastructure\Suite.Infrastructure.csproj",
            "src\Suite.Windowing\Suite.Windowing.csproj",
            "tests\Suite.Core.Tests\Suite.Core.Tests.csproj"
          )
          foreach ($project in $projects) {
            Write-Host "Building $project"
            msbuild $project /t:Build /p:Configuration=Release /p:Platform=AnyCPU /nologo /verbosity:minimal
            if ($LASTEXITCODE -ne 0) {
              throw "MSBuild failed for $project with exit code $LASTEXITCODE."
            }
          }

      - name: Run core tests
        shell: powershell
        run: |
          $testExe = "tests\Suite.Core.Tests\bin\Release\Suite.Core.Tests.exe"
          if (-not (Test-Path $testExe -PathType Leaf)) {
            throw "The core test executable was not built: $testExe"
          }
          & $testExe
          if ($LASTEXITCODE -ne 0) {
            throw "Core tests failed with exit code $LASTEXITCODE."
          }

  package:
    name: Build and package MSI (${{ matrix.platform }})
    runs-on: [ self-hosted, windows ]
    needs: static
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        platform: [ x64, x86 ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify VSTO build support
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found. Install Visual Studio 2022 with the Office/SharePoint development workload on this runner."
          }
          $installPath = & $vswhere -version "[17.0,18.0)" -latest -products * -property installationPath | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace([string]$installPath)) {
            throw "Visual Studio 2022 was not found."
          }
          $root = Join-Path $installPath "MSBuild\Microsoft\VisualStudio"
          $targets = $null
          if (Test-Path $root -PathType Container) {
            $targets = Get-ChildItem -Path $root -Directory -ErrorAction SilentlyContinue |
              Sort-Object -Property Name -Descending |
              ForEach-Object {
                $path = Join-Path $_.FullName "OfficeTools\Microsoft.VisualStudio.OfficeTools.targets"
                if (Test-Path $path -PathType Leaf) { $path }
              } |
              Select-Object -First 1
          }
          if (-not $targets) {
            throw "VSTO build targets are missing. Install the Office/SharePoint development workload on this self-hosted runner."
          }
          Write-Host "VSTO targets found: $targets"

      - name: Build, test and package
        shell: powershell
        run: |
          .\scripts\verify-windows.ps1 -Platform ${{ matrix.platform }}

      - name: Upload MSI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-${{ matrix.platform }}
          path: installer/Suite.Installer/bin/Release/${{ matrix.platform }}/*.msi
          if-no-files-found: warn

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-log-${{ matrix.platform }}
          path: artifacts/*.log
          if-no-files-found: warn
